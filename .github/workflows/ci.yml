name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  DATABASE_URL: postgresql://app:dev-app-password@localhost:5432/postgres
  DATABASE_MIGRATOR_URL: postgresql://migrator:dev-migrator-password@localhost:5432/postgres
  DATABASE_URL_SUPERUSER: postgresql://postgres:dev-postgres-password-change-me@localhost:5432/postgres
  REDIS_URL: redis://localhost:6379/0
  TEST_DB_NAME: werefa_test
  STORAGE_PROVIDER: memory
  APP_ENV: test

jobs:
  quality-gate:
    name: Build, lint, typecheck, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: dev-postgres-password-change-me
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check --if-present

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (shared + db + api)
        run: npm run test:unit --workspaces --if-present && npm test --workspaces --if-present

      - name: Bootstrap dev database (roles, migrations, RLS)
        run: |
          npm run db:roles
          npm run db:migrate
          npm run db:rls

      - name: Integration tests (A–F, real Nest against werefa_test)
        run: npm run test:integration --workspace @werefa/api

      - name: Build all workspaces
        run: npm run build

      - name: API startup smoke test
        run: |
          node apps/api/dist/main.js &
          API_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/api/v1/health/ready >/dev/null 2>&1; then
              curl -sf http://127.0.0.1:3000/api/v1/health/ready
              kill $API_PID
              exit 0
            fi
            sleep 1
          done
          echo "API did not become ready" >&2
          kill $API_PID 2>/dev/null || true
          exit 1
